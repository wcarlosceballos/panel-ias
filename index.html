<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline'">
<title>Panel de IAs</title>
<style>

  * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', system-ui, sans-serif; }
  html, body { height: 100%; }
  body { background: linear-gradient(135deg, #0f0c29, #302b63, #24243e); color: #fff; display: flex; overflow: hidden; }

  /* Menú lateral */
  .sidebar { width: 280px; flex-shrink: 0; height: 100%; display: flex; flex-direction: column;
    background: rgba(255,255,255,0.05); border-right: 1px solid rgba(255,255,255,0.1); backdrop-filter: blur(10px); }
  .brand { padding: 22px 20px 14px; }
  .brand h1 { font-size: 1.3rem; background: linear-gradient(90deg, #00d4ff, #a855f7, #ec4899);
    -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; }
  .brand p { color: #9a9ab0; font-size: 0.8rem; margin-top: 4px; }
  .menu { flex: 1; overflow-y: auto; padding: 6px 10px 16px; }
  .item { width: 100%; display: flex; align-items: center; gap: 12px; padding: 10px; margin-bottom: 4px;
    background: transparent; border: 1px solid transparent; border-radius: 12px; color: #fff; text-align: left; cursor: pointer; transition: background .2s, border-color .2s; }
  .item:hover { background: rgba(255,255,255,0.08); }
  .item:focus-visible { outline: 2px solid #00d4ff; outline-offset: 2px; }
  .item.active { background: rgba(255,255,255,0.12); border-color: rgba(255,255,255,0.3); }
  .ico { width: 40px; height: 40px; border-radius: 10px; display: flex; align-items: center; justify-content: center;
    font-weight: bold; font-size: 0.95rem; flex-shrink: 0; }
  .txt { min-width: 0; }
  .txt b { display: block; font-size: 0.95rem; font-weight: 600; }
  .txt span { display: block; font-size: 0.75rem; color: #b0b0b0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

  /* Zona principal */
  .main { flex: 1; min-width: 0; height: 100%; display: flex; flex-direction: column; }
  .topbar { display: flex; align-items: center; gap: 12px; padding: 12px 18px; border-bottom: 1px solid rgba(255,255,255,0.1); background: rgba(0,0,0,0.2); }
  .burger { display: none; background: none; border: 1px solid rgba(255,255,255,0.25); color: #fff; border-radius: 8px; padding: 6px 10px; font-size: 1.1rem; cursor: pointer; }
  .title { flex: 1; min-width: 0; }
  .title b { font-size: 1.05rem; }
  .title span { display: block; font-size: 0.78rem; color: #a855f7; font-weight: 600; }
  .btn { background: rgba(255,255,255,0.1); border: 1px solid rgba(255,255,255,0.25); color: #fff; padding: 8px 14px; border-radius: 10px;
    font-size: 0.85rem; cursor: pointer; text-decoration: none; white-space: nowrap; }
  .btn:hover { background: rgba(255,255,255,0.2); }
  .btn:focus-visible { outline: 2px solid #00d4ff; outline-offset: 2px; }
  .notice { display: none; padding: 8px 18px; font-size: 0.8rem; color: #e9d5ff; background: rgba(168,85,247,0.15); border-bottom: 1px solid rgba(168,85,247,0.3); }
  .notice.show { display: block; }
  .stage { flex: 1; position: relative; min-height: 0; }
  iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; background: #fff; display: none; }
  iframe.show { display: block; }

  /* Pantalla de inicio / detalle */
  .home { position: absolute; inset: 0; overflow-y: auto; padding: 40px 28px; }
  .home.hide { display: none; }
  .home-inner { max-width: 640px; margin: 0 auto; }
  .home h2 { font-size: 1.8rem; margin-bottom: 8px; }
  .home p { color: #b0b0b0; margin-bottom: 22px; }
  .uses { list-style: none; background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1); border-radius: 14px; padding: 16px 20px; margin-bottom: 20px; }
  .uses li { position: relative; padding-left: 22px; margin: 8px 0; color: #e0e0e0; }
  .uses li::before { content: '✓'; position: absolute; left: 0; color: #00d4ff; font-weight: bold; }

  @media (max-width: 760px) {
    .sidebar { position: fixed; z-index: 10; left: 0; top: 0; transform: translateX(-100%); transition: transform .25s; background: #1b1840; }
    .sidebar.open { transform: none; }
  }
  @media (prefers-reduced-motion: reduce) { .sidebar, .item { transition: none; } }

  .openai { background: linear-gradient(135deg, #10a37f, #0d8a6a); }
  .claude { background: linear-gradient(135deg, #d97757, #b85c3e); }
  .gemini { background: linear-gradient(135deg, #4285f4, #9b72cb); }
  .copilot { background: linear-gradient(135deg, #0078d4, #00bcf2); }
  .midjourney { background: linear-gradient(135deg, #1a1a2e, #4a4a8a); }
  .dalle { background: linear-gradient(135deg, #ff6b6b, #ee5a6f); }
  .perplexity { background: linear-gradient(135deg, #20808d, #1a6670); }
  .deepseek { background: linear-gradient(135deg, #4d6bfe, #2d4bd8); }
  .grok { background: linear-gradient(135deg, #000, #333); }
  .mistral { background: linear-gradient(135deg, #ff7000, #ff9500); }
  .meta { background: linear-gradient(135deg, #0866ff, #0080ff); }
  .stable { background: linear-gradient(135deg, #8b5cf6, #a78bfa); }

  .stage { background: transparent; }
  .home { background: transparent; }
</style>
</head>
<body>
  <nav class="sidebar" id="sidebar" aria-label="Herramientas de IA">
    <div class="brand"><h1>Panel de IAs</h1><p>Elige una herramienta para abrirla aquí</p></div>
    <div class="menu" id="menu"></div>
  </nav>

  <div class="main">
    <div class="topbar">
      <div class="title"><b id="tTitle">Selecciona una herramienta</b><span id="tBest"></span></div>
      <button class="btn" id="info" style="display:none">Ver usos</button>
      <button class="btn" id="reload" style="display:none">Recargar</button>
      <button class="btn" id="ext" style="display:none">Abrir en el navegador ↗</button>
    </div>
    <div class="stage" id="stage">
      <div class="home" id="home"><div class="home-inner" id="homeInner"></div></div>
    </div>
  </div>

<script>
  const ias = [
      { name: 'ChatGPT', desc: 'IA conversacional de OpenAI', url: 'https://chatgpt.com', cls: 'openai', icon: 'GPT',
        best: 'Ideal como herramienta todoterreno',
        uses: ['Redactar textos, correos y resúmenes', 'Programar y depurar código', 'Analizar archivos, datos y gráficos', 'Generar imágenes y usar voz'] },
      { name: 'Claude', desc: 'Asistente de Anthropic', url: 'https://claude.ai', cls: 'claude', icon: 'C',
        best: 'Ideal para textos largos y código',
        uses: ['Leer y analizar documentos extensos', 'Escribir con tono natural y cuidado', 'Programar proyectos completos', 'Crear documentos, apps y presentaciones'] },
      { name: 'Gemini', desc: 'IA multimodal de Google', url: 'https://gemini.google.com', cls: 'gemini', icon: 'G',
        best: 'Ideal si vives en el ecosistema Google',
        uses: ['Trabajar con Gmail, Drive y Docs', 'Analizar imágenes, audio y video', 'Procesar contextos muy largos', 'Investigar con búsqueda de Google'] },
      { name: 'Copilot', desc: 'Asistente de Microsoft', url: 'https://copilot.microsoft.com', cls: 'copilot', icon: 'Co',
        best: 'Ideal para Windows y Office',
        uses: ['Ayuda en Word, Excel y PowerPoint', 'Resumir correos de Outlook', 'Buscar información con fuentes', 'Generar imágenes sin costo'] },
      { name: 'Perplexity', desc: 'Buscador con IA', url: 'https://perplexity.ai', cls: 'perplexity', icon: 'P',
        best: 'Ideal para investigar con fuentes',
        uses: ['Respuestas con citas verificables', 'Investigación profunda de temas', 'Comparar productos y noticias', 'Reemplazar búsquedas en Google'] },
      { name: 'DeepSeek', desc: 'IA open-source avanzada', url: 'https://chat.deepseek.com', cls: 'deepseek', icon: 'DS',
        best: 'Ideal para razonamiento y código',
        uses: ['Resolver problemas de lógica y matemáticas', 'Generar y revisar código', 'Alternativa gratuita y abierta', 'Usar modelos propios vía API económica'] },
      { name: 'Grok', desc: 'IA de xAI / Elon Musk', url: 'https://grok.com', cls: 'grok', icon: 'X',
        best: 'Ideal para tendencias en tiempo real',
        uses: ['Consultar lo que pasa en X (Twitter)', 'Seguir noticias de último minuto', 'Conversar con tono directo y casual', 'Generar imágenes'] },
      { name: 'Mistral', desc: 'Le Chat de Mistral AI', url: 'https://chat.mistral.ai', cls: 'mistral', icon: 'M',
        best: 'Ideal si valoras rapidez y privacidad europea',
        uses: ['Chat rápido de uso general', 'Escribir y traducir en varios idiomas', 'Ayuda con código', 'Modelos abiertos para desarrolladores'] },
      { name: 'Meta AI', desc: 'Llama de Meta', url: 'https://meta.ai', cls: 'meta', icon: '∞',
        best: 'Ideal dentro de tus redes sociales',
        uses: ['Preguntar desde WhatsApp, Instagram y Messenger', 'Respuestas y ideas rápidas', 'Generar imágenes sencillas', 'Usar modelos Llama abiertos'] },
      { name: 'Midjourney', desc: 'Generación de imágenes artísticas', url: 'https://midjourney.com', cls: 'midjourney', icon: 'MJ',
        best: 'Ideal para imágenes de calidad artística',
        uses: ['Ilustraciones y arte conceptual', 'Imágenes para marca y redes', 'Moodboards y referencias visuales', 'Estilos estéticos muy detallados'] },
      { name: 'DALL·E', desc: 'Imágenes con IA de OpenAI', url: 'https://chatgpt.com', cls: 'dalle', icon: 'DE',
        best: 'Ideal para imágenes dentro de ChatGPT',
        uses: ['Crear imágenes describiéndolas con texto', 'Editar y modificar imágenes por chat', 'Logos, íconos y mockups rápidos', 'Imágenes con texto legible'] },
      { name: 'Stable Diffusion', desc: 'Imágenes open-source', url: 'https://stability.ai', cls: 'stable', icon: 'SD',
        best: 'Ideal para control total y uso local',
        uses: ['Generar imágenes en tu propio equipo', 'Personalizar estilos con modelos propios', 'Editar zonas de una imagen (inpainting)', 'Flujos avanzados sin límites de uso'] }
    ];

  const $ = id => document.getElementById(id);
  const menu = $('menu'), home = $('home'), homeInner = $('homeInner'), stage = $('stage');
  let current = null;

  // Mantiene la vista de la herramienta ajustada al área derecha
  function sendBounds() {
    const r = stage.getBoundingClientRect();
    window.api.bounds({ x: r.x, y: r.y, width: r.width, height: r.height });
  }
  new ResizeObserver(sendBounds).observe(stage);
  window.addEventListener('resize', sendBounds);

  ias.forEach((ia, i) => {
    const b = document.createElement('button');
    b.className = 'item'; b.dataset.i = i;
    b.innerHTML = `<div class="ico ${ia.cls}">${ia.icon}</div><div class="txt"><b>${ia.name}</b><span>${ia.best.replace('Ideal ', '')}</span></div>`;
    b.onclick = () => select(i);
    menu.appendChild(b);
  });

  function detail(ia) {
    homeInner.innerHTML = `<h2>${ia.name}</h2><p>${ia.desc} · ${ia.best}</p>
      <ul class="uses">${ia.uses.map(u => `<li>${u}</li>`).join('')}</ul>`;
  }

  async function select(i, showInfo) {
    const ia = ias[i]; current = i;
    document.querySelectorAll('.item').forEach(el => el.classList.toggle('active', +el.dataset.i === i));
    $('tTitle').textContent = ia.name; $('tBest').textContent = ia.best;
    ['info', 'reload', 'ext'].forEach(id => $(id).style.display = '');
    detail(ia);
    try { localStorage.setItem('ia-actual', i); } catch (e) {}
    if (showInfo) { await window.api.hide(); home.classList.remove('hide'); return; }
    home.classList.add('hide');
    sendBounds();
    await window.api.show(ia.name, ia.url);
  }

  $('info').onclick = () => { if (current !== null) select(current, true); };
  $('reload').onclick = () => window.api.reload();
  $('ext').onclick = () => { if (current !== null) window.api.external(ias[current].url); };

  homeInner.innerHTML = '<h2>Panel de IAs generativas</h2><p>Elige una herramienta en el menú lateral. Se abrirá en esta misma ventana y tu sesión iniciada se conservará.</p>';
  let saved = null; try { saved = localStorage.getItem('ia-actual'); } catch (e) {}
  if (saved !== null && ias[+saved]) select(+saved, true);
</script>
</body>
</html>
